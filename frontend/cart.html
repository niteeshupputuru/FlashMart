<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FlashMart - Cart</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        /* NAVBAR */

        nav {
            background: #111827;
            color: white;
            padding: 18px 6%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        nav a {
            background: #2563eb;
            color: white;
            text-decoration: none;

            padding: 12px 22px;
            border-radius: 8px;

            font-weight: bold;
        }

        /* MAIN */

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 50px auto;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 30px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        /* CART */

        .cart-box {
            background: white;
            padding: 25px;
            border-radius: 15px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.08);
        }

        .cart-item {
            display: flex;
            gap: 20px;

            padding: 20px 0;

            border-bottom: 1px solid #e5e7eb;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-image {
            width: 130px;
            height: 130px;

            object-fit: cover;

            border-radius: 10px;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .item-price {
            color: #2563eb;
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity button {
            width: 35px;
            height: 35px;

            border: none;
            border-radius: 6px;

            background: #e5e7eb;

            font-size: 18px;
            cursor: pointer;
        }

        .quantity button:hover {
            background: #d1d5db;
        }

        .quantity span {
            font-weight: bold;
        }

        .remove-btn {
            margin-top: 12px;

            background: #ef4444;
            color: white;

            border: none;
            padding: 8px 14px;

            border-radius: 6px;

            cursor: pointer;
        }

        .remove-btn:hover {
            background: #dc2626;
        }

        /* SUMMARY */

        .summary {
            background: white;
            padding: 25px;

            border-radius: 15px;

            height: fit-content;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.08);
        }

        .summary h2 {
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;

            margin: 15px 0;

            font-size: 17px;
        }

        .total {
            border-top: 1px solid #ddd;

            padding-top: 20px;

            font-size: 24px;
            font-weight: bold;
        }

        .checkout-btn {
            width: 100%;

            margin-top: 25px;

            padding: 15px;

            background: #2563eb;
            color: white;

            border: none;

            border-radius: 8px;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .checkout-btn:hover {
            background: #1d4ed8;
        }

        /* EMPTY */

        .empty {
            text-align: center;
            padding: 80px 20px;
        }

        .empty h2 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .empty p {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .shop-btn {
            display: inline-block;

            background: #2563eb;
            color: white;

            text-decoration: none;

            padding: 14px 25px;

            border-radius: 8px;

            font-weight: bold;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .cart-item {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav>

    <div class="logo">
        🛒 FlashMart
    </div>

    <a href="/">
        Home
    </a>

</nav>


<!-- MAIN -->

<div class="container">

    <h1>
        Your Shopping Cart
    </h1>


    <div id="cartContent"></div>

</div>


<script>

    /* ==========================================
       GET CART
    ========================================== */

    function getCart() {

        try {

            return JSON.parse(
                localStorage.getItem("cart")
            ) || [];

        } catch (error) {

            console.log(error);

            return [];

        }

    }


    /* ==========================================
       SAVE CART
    ========================================== */

    function saveCart(cart) {

        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );

    }


    /* ==========================================
       DISPLAY CART
    ========================================== */

    function displayCart() {

        const cart = getCart();

        const content =
            document.getElementById("cartContent");


        /* EMPTY CART */

        if (!cart.length) {

            content.innerHTML = `

                <div class="cart-box empty">

                    <h2>
                        Your Cart is Empty 🛒
                    </h2>

                    <p>
                        Please add products from
                        the home page.
                    </p>

                    <a
                        href="/"
                        class="shop-btn"
                    >
                        Continue Shopping
                    </a>

                </div>

            `;

            return;

        }


        /* TOTAL */

        let subtotal = 0;

        let itemCount = 0;


        cart.forEach(item => {

            const price =
                Number(item.price) || 0;

            const quantity =
                Number(item.quantity) || 1;

            subtotal +=
                price * quantity;

            itemCount += quantity;

        });


        const delivery = 0;

        const total =
            subtotal + delivery;


        /* CART HTML */

        let itemsHTML = "";


        cart.forEach((item, index) => {

            const price =
                Number(item.price) || 0;

            const quantity =
                Number(item.quantity) || 1;

            const itemTotal =
                price * quantity;


            itemsHTML += `

                <div class="cart-item">

                    <img
                        src="${item.image}"
                        class="cart-image"
                        alt="${item.name}"
                        onerror="
                        this.src='https://via.placeholder.com/300x300?text=Product'
                        "
                    >

                    <div class="item-info">

                        <div class="item-name">
                            ${item.name}
                        </div>

                        <div class="item-price">
                            ₹${price.toLocaleString("en-IN")}
                        </div>

                        <div class="quantity">

                            <button
                                onclick="decreaseQuantity(${index})"
                            >
                                −
                            </button>

                            <span>
                                ${quantity}
                            </span>

                            <button
                                onclick="increaseQuantity(${index})"
                            >
                                +
                            </button>

                        </div>

                        <div style="
                            margin-top:10px;
                            font-weight:bold;
                        ">

                            Item Total:
                            ₹${itemTotal.toLocaleString("en-IN")}

                        </div>

                        <button
                            class="remove-btn"
                            onclick="removeItem(${index})"
                        >
                            Remove
                        </button>

                    </div>

                </div>

            `;

        });


        content.innerHTML = `

            <div class="cart-layout">

                <!-- CART ITEMS -->

                <div class="cart-box">

                    ${itemsHTML}

                </div>


                <!-- SUMMARY -->

                <div class="summary">

                    <h2>
                        Order Summary
                    </h2>

                    <div class="summary-row">

                        <span>
                            Items
                        </span>

                        <span>
                            ${itemCount}
                        </span>

                    </div>


                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <span>
                            ₹${subtotal.toLocaleString("en-IN")}
                        </span>

                    </div>


                    <div class="summary-row">

                        <span>
                            Delivery
                        </span>

                        <span>
                            FREE
                        </span>

                    </div>


                    <div class="summary-row total">

                        <span>
                            Total
                        </span>

                        <span>
                            ₹${total.toLocaleString("en-IN")}
                        </span>

                    </div>


                    <button
                        class="checkout-btn"
                        onclick="goToCheckout()"
                    >
                        Proceed to Checkout
                    </button>

                </div>

            </div>

        `;

    }


    /* ==========================================
       INCREASE
    ========================================== */

    function increaseQuantity(index) {

        const cart = getCart();

        cart[index].quantity =
            (Number(cart[index].quantity) || 1) + 1;

        saveCart(cart);

        displayCart();

    }


    /* ==========================================
       DECREASE
    ========================================== */

    function decreaseQuantity(index) {

        const cart = getCart();

        let quantity =
            Number(cart[index].quantity) || 1;


        if (quantity > 1) {

            cart[index].quantity =
                quantity - 1;

        } else {

            cart.splice(index, 1);

        }


        saveCart(cart);

        displayCart();

    }


    /* ==========================================
       REMOVE
    ========================================== */

    function removeItem(index) {

        const cart = getCart();

        cart.splice(index, 1);

        saveCart(cart);

        displayCart();

    }


    /* ==========================================
       CHECKOUT
    ========================================== */

    function goToCheckout() {

        const cart = getCart();


        if (!cart.length) {

            alert(
                "Your cart is empty!"
            );

            return;

        }


        window.location.href =
            "/checkout";

    }


    /* ==========================================
       PAGE LOAD
    ========================================== */

    document.addEventListener(
        "DOMContentLoaded",
        displayCart
    );

</script>


</body>

</html>
