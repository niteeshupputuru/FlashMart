<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashMart - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        nav {
            background: #111827;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .home-btn {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 8px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #111827;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">🛒 FlashMart</div>
    <a href="/" class="home-btn">Home</a>
</nav>

<div class="container">

    <h1>Login</h1>

    <form id="loginForm">

        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div class="message" id="message"></div>

    <div class="register">
        Don't have an account?
        <a href="/register">Register</a>
    </div>

</div>

<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");

        try {

            const response = await fetch(
                "/api/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );

            const data =
                await response.json();

            if (response.ok) {

                message.style.color = "green";

                message.innerText =
                    "Login successful!";

                localStorage.setItem(
                    "user",
                    JSON.stringify(data.user)
                );

                setTimeout(() => {
                    window.location.href = "/";
                }, 1000);

            } else {

                message.style.color = "red";

                message.innerText =
                    data.error || "Login failed";

            }

        } catch (error) {

            message.style.color = "red";

            message.innerText =
                "Server connection failed";

            console.log(error);

        }

    });

</script>

</body>
</html>
