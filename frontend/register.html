<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashMart - Register</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f7fb;
            margin: 0;
        }

        nav {
            background: #111827;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 8px;
        }

        .box {
            max-width: 430px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px #ddd;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0 18px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 8px;
            font-size: 16px;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">🛒 FlashMart</div>
    <a href="/">Home</a>
</nav>

<div class="box">

    <h1>Create Account</h1>

    <form id="registerForm">

        <label>Name</label>
        <input id="name" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Password</label>
        <input type="password" id="password" minlength="6" required>

        <button type="submit">
            Register
        </button>

    </form>

    <div id="message"></div>

    <p style="text-align:center">
        Already have an account?
        <a href="/login">Login</a>
    </p>

</div>

<script>

document
.getElementById("registerForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const response = await fetch(
        "/api/register",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                name:
                    document.getElementById("name").value,

                email:
                    document.getElementById("email").value,

                password:
                    document.getElementById("password").value

            })
        }
    );

    const data = await response.json();

    const message =
        document.getElementById("message");

    if (response.ok) {

        message.style.color = "green";

        message.innerText =
            "Registration successful!";

        setTimeout(() => {
            window.location.href = "/login";
        }, 1000);

    } else {

        message.style.color = "red";

        message.innerText =
            data.error || "Registration failed";

    }

});

</script>

</body>
</html>
