<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - FlashMart</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #222;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            color: white;
            text-decoration: none;
            background: #2563eb;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        .product-details {
            background: white;
            border-radius: 18px;
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .product-image {
            width: 100%;
            height: 450px;
            object-fit: cover;
            border-radius: 15px;
            background: #eee;
        }

        .product-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-name {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .product-price {
            font-size: 30px;
            color: #2563eb;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .description {
            font-size: 18px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .add-cart {
            border: none;
            background: #111827;
            color: white;
            padding: 16px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .add-cart:hover {
            background: #2563eb;
        }

        .loading {
            text-align: center;
            font-size: 22px;
            padding: 60px;
        }

        .error {
            text-align: center;
            color: red;
            font-size: 20px;
            padding: 60px;
        }

        @media (max-width: 700px) {

            .product-details {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .product-image {
                height: 300px;
            }

            .product-name {
                font-size: 30px;
            }
        }
    </style>

</head>


<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            🛒 FlashMart
        </div>

        <div class="nav-buttons">

            <a href="/" class="nav-btn">
                Home
            </a>

            <a href="/cart" class="nav-btn">
                Cart 🛍️
            </a>

        </div>

    </nav>


    <!-- PRODUCT -->

    <div class="container">

        <div id="productContainer">

            <div class="loading">
                Loading product...
            </div>

        </div>

    </div>


    <script>

        // =================================
        // GET PRODUCT ID FROM URL
        // =================================

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const productId =
            urlParams.get("id");


        // =================================
        // LOAD PRODUCT
        // =================================

        async function loadProduct() {

            const container =
                document.getElementById(
                    "productContainer"
                );

            try {

                const response =
                    await fetch("https://flashmart-backend.onrender.com/api/products")
                    

                if (!response.ok) {

                    throw new Error(
                        "Products API failed"
                    );
                }


                const products =
                    await response.json();


                const product =
                    products.find(
                        p =>
                            String(p.id) ===
                            String(productId)
                    );


                if (!product) {

                    container.innerHTML = `

                        <div class="error">

                            ❌ Product not found.

                            <br><br>

                            <a href="/">
                                Back to Products
                            </a>

                        </div>

                    `;

                    return;
                }


                // =================================
                // DISPLAY PRODUCT
                // =================================

                container.innerHTML = `

                    <div class="product-details">

                        <div>

                            <img
                                class="product-image"
                                src="${product.image}"
                                alt="${product.name}"
                                onerror="
                                    this.src='https://via.placeholder.com/500x500?text=Product'
                                "
                            >

                        </div>


                        <div class="product-info">

                            <h1 class="product-name">
                                ${product.name}
                            </h1>


                            <div class="product-price">
                                ₹${product.price}
                            </div>


                            <p class="description">

                                ${
                                    product.description ||
                                    "High quality product from FlashMart."
                                }

                            </p>


                            <button
                                class="add-cart"
                                onclick="addToCart(${product.id})"
                            >
                                🛒 Add to Cart
                            </button>

                        </div>

                    </div>

                `;

            }

            catch (error) {

                console.error(error);

                container.innerHTML = `

                    <div class="error">

                        ❌ Unable to load product.

                        <br><br>

                        Please check the server.

                    </div>

                `;
            }

        }


        // =================================
        // ADD TO CART
        // =================================

        function addToCart(productId) {

            let cart =
                JSON.parse(
                    localStorage.getItem("cart")
                ) || [];


            cart.push(productId);


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            alert(
                "Product added to cart 🛒"
            );

        }


        // =================================
        // START
        // =================================

        loadProduct();

    </script>

</body>

</html>
