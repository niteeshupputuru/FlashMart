<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlashMart - Checkout</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        nav {
            background: #111827;
            color: white;
            padding: 18px 6%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        nav a {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 1150px;
            margin: 40px auto;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .box {
            background: white;
            padding: 28px;
            border-radius: 15px;

            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h2 {
            margin-bottom: 25px;
            font-size: 26px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            font-size: 16px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .product {
            display: flex;
            gap: 15px;

            padding: 15px 0;

            border-bottom: 1px solid #e5e7eb;
        }

        .product img {
            width: 80px;
            height: 80px;

            object-fit: cover;

            border-radius: 8px;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-weight: bold;
            font-size: 17px;
        }

        .product-price {
            margin-top: 7px;
            color: #2563eb;
            font-weight: bold;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;

            margin-top: 18px;

            font-size: 17px;
        }

        .total {
            border-top: 1px solid #ddd;

            margin-top: 20px;
            padding-top: 20px;

            font-size: 24px;
            font-weight: bold;
        }

        .place-order {
            width: 100%;

            margin-top: 25px;
            padding: 16px;

            background: #2563eb;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        .place-order:hover {
            background: #1d4ed8;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
        }

        .empty p {
            color: #6b7280;
            margin-bottom: 20px;
        }

        .continue {
            display: inline-block;

            background: #2563eb;
            color: white;

            padding: 12px 20px;

            border-radius: 8px;

            text-decoration: none;
            font-weight: bold;
        }

        #message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-weight: bold;
        }

        @media (max-width: 800px) {
            .checkout-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>


<body>


<nav>

    <div class="logo">
        🛒 FlashMart
    </div>

    <a href="/">
        Home
    </a>

</nav>


<div class="container">

    <div class="checkout-grid">


        <!-- DELIVERY DETAILS -->

        <div class="box">

            <h2>
                📦 Delivery Details
            </h2>


            <form id="checkoutForm">

                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="Enter your complete address"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter your city"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Pincode
                    </label>

                    <input
                        type="text"
                        id="pincode"
                        placeholder="Enter pincode"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="place-order"
                >
                    🛍️ Place Order
                </button>


                <div id="message"></div>

            </form>

        </div>


        <!-- ORDER SUMMARY -->

        <div class="box">

            <h2>
                🛒 Order Summary
            </h2>


            <div id="orderItems"></div>


            <div id="summary"></div>

        </div>


    </div>

</div>


<script>

    // ==========================================
    // GET CART
    // ==========================================

    function getCart() {

        try {

            return JSON.parse(
                localStorage.getItem("cart")
            ) || [];

        } catch (error) {

            console.log(error);

            return [];

        }

    }


    // ==========================================
    // LOAD CHECKOUT
    // ==========================================

    function loadCheckout() {

        const cart = getCart();

        const orderItems =
            document.getElementById("orderItems");

        const summary =
            document.getElementById("summary");


        // EMPTY CART

        if (cart.length === 0) {

            orderItems.innerHTML = `

                <div class="empty">

                    <h3>
                        Your cart is empty 🛒
                    </h3>

                    <p>
                        Please add products first.
                    </p>

                    <a
                        href="/"
                        class="continue"
                    >
                        Continue Shopping
                    </a>

                </div>

            `;

            summary.innerHTML = `

                <div class="summary-row total">

                    <span>
                        Total
                    </span>

                    <span>
                        ₹0
                    </span>

                </div>

            `;

            return;

        }


        // ======================================
        // PRODUCTS
        // ======================================

        let html = "";

        let total = 0;

        let itemCount = 0;


        cart.forEach(item => {

            const price =
                Number(item.price) || 0;

            const quantity =
                Number(item.quantity) || 1;

            const itemTotal =
                price * quantity;


            total += itemTotal;

            itemCount += quantity;


            html += `

                <div class="product">

                    <img
                        src="${item.image}"
                        alt="${item.name}"
                    >

                    <div class="product-info">

                        <div class="product-name">
                            ${item.name}
                        </div>

                        <div>
                            Quantity: ${quantity}
                        </div>

                        <div class="product-price">
                            ₹${itemTotal.toLocaleString("en-IN")}
                        </div>

                    </div>

                </div>

            `;

        });


        orderItems.innerHTML = html;


        // ======================================
        // SUMMARY
        // ======================================

        summary.innerHTML = `

            <div class="summary-row">

                <span>
                    Items
                </span>

                <span>
                    ${itemCount}
                </span>

            </div>


            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <span>
                    ₹${total.toLocaleString("en-IN")}
                </span>

            </div>


            <div class="summary-row">

                <span>
                    Delivery
                </span>

                <span>
                    FREE
                </span>

            </div>


            <div class="summary-row total">

                <span>
                    Total
                </span>

                <span>
                    ₹${total.toLocaleString("en-IN")}
                </span>

            </div>

        `;

    }


    // ==========================================
    // PLACE ORDER
    // ==========================================

    document
        .getElementById("checkoutForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const cart = getCart();


            if (cart.length === 0) {

                alert(
                    "Your cart is empty!"
                );

                return;

            }


            // CUSTOMER DETAILS

            const customer = {

                name:
                    document
                    .getElementById("name")
                    .value
                    .trim(),

                email:
                    document
                    .getElementById("email")
                    .value
                    .trim(),

                phone:
                    document
                    .getElementById("phone")
                    .value
                    .trim(),

                address:
                    document
                    .getElementById("address")
                    .value
                    .trim(),

                city:
                    document
                    .getElementById("city")
                    .value
                    .trim(),

                pincode:
                    document
                    .getElementById("pincode")
                    .value
                    .trim()

            };


            const button =
                document.querySelector(
                    ".place-order"
                );


            button.disabled = true;

            button.innerText =
                "Processing Order...";


            try {

                // ==================================
                // SEND TO SERVER
                // ==================================

                const response =
                    await fetch(
                        "/api/orders",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    customer:
                                        customer,

                                    items:
                                        cart

                                })

                        }
                    );


                const result =
                    await response.json();


                // ==================================
                // SUCCESS
                // ==================================

                if (response.ok &&
                    result.success) {


                    // Clear cart

                    localStorage.removeItem(
                        "cart"
                    );


                    document.getElementById(
                        "message"
                    ).style.display = "block";


                    document.getElementById(
                        "message"
                    ).innerHTML = `

                        ✅ Order placed successfully!

                        <br><br>

                        Order ID:
                        <strong>
                            ${result.orderId}
                        </strong>

                        <br>

                        Total:
                        <strong>
                            ₹${result.total.toLocaleString("en-IN")}
                        </strong>

                    `;


                    document.getElementById(
                        "message"
                    ).style.background =
                        "#dcfce7";


                    document.getElementById(
                        "message"
                    ).style.color =
                        "#166534";


                    // Reset form

                    document
                        .getElementById(
                            "checkoutForm"
                        )
                        .reset();


                    // Refresh summary

                    loadCheckout();


                    button.innerText =
                        "Order Placed ✅";

                }

                else {

                    throw new Error(
                        result.error ||
                        "Order failed"
                    );

                }


            } catch (error) {

                console.log(
                    "Order Error:",
                    error
                );


                alert(
                    "Order could not be placed. Please try again."
                );


                button.disabled = false;

                button.innerText =
                    "🛍️ Place Order";

            }

        });


    // ==========================================
    // START
    // ==========================================

    document.addEventListener(
        "DOMContentLoaded",
        loadCheckout
    );

</script>


</body>

</html>
