<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlashMart - Checkout</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        .home-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 50px auto;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 35px;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 30px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-bottom: 25px;
            font-size: 26px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 16px;
        }

        input,
        textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: bold;
            margin-top: 25px;
        }

        .payment {
            margin-top: 25px;
        }

        .payment label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .payment input {
            width: auto;
        }

        .place-order {
            width: 100%;
            margin-top: 30px;
            padding: 16px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .place-order:hover {
            background: #1d4ed8;
        }

        .place-order:disabled {
            background: #6b7280;
            cursor: not-allowed;
        }

        .empty {
            text-align: center;
            padding: 40px;
            font-size: 20px;
        }

        @media (max-width: 800px) {
            .checkout-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">🛒 FlashMart</div>

    <button class="home-btn" onclick="goHome()">
        Home
    </button>
</header>

<div class="container">

    <h1>Checkout</h1>

    <div class="checkout-grid">

        <!-- DELIVERY DETAILS -->
        <div class="card">

            <h2>📦 Delivery Details</h2>

            <form id="checkoutForm">

                <label>Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                    required
                >

                <label>Address</label>
                <textarea
                    id="address"
                    placeholder="Enter delivery address"
                    required
                ></textarea>

                <label>City</label>
                <input
                    type="text"
                    id="city"
                    placeholder="Enter city"
                    required
                >

                <label>Pincode</label>
                <input
                    type="text"
                    id="pincode"
                    placeholder="Enter pincode"
                    required
                >

                <div class="payment">

                    <h2>Payment Method</h2>

                    <label>
                        <input
                            type="radio"
                            name="payment"
                            value="Cash on Delivery"
                            checked
                        >
                        Cash on Delivery
                    </label>

                </div>

                <button
                    type="submit"
                    class="place-order"
                    id="placeOrderBtn"
                >
                    Place Order
                </button>

            </form>

        </div>


        <!-- ORDER SUMMARY -->
        <div class="card">

            <h2>Order Summary</h2>

            <div id="orderItems">
                Loading cart...
            </div>

            <div class="total">
                <span>Total</span>
                <span id="totalAmount">₹0</span>
            </div>

        </div>

    </div>

</div>


<script>

    // ==============================
    // LIVE BACKEND URL
    // ==============================

    const API_URL =
        "https://flashmart-backend.onrender.com";


    // ==============================
    // GET CART
    // ==============================

    let cart = JSON.parse(
        localStorage.getItem("cart") || "[]"
    );


    // ==============================
    // DISPLAY CART
    // ==============================

    function loadCart() {

        const container =
            document.getElementById("orderItems");

        const totalElement =
            document.getElementById("totalAmount");

        if (!cart || cart.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    Your cart is empty.
                </div>
            `;

            totalElement.textContent = "₹0";

            return;
        }


        let total = 0;

        container.innerHTML = "";


        cart.forEach(item => {

            const quantity =
                Number(item.quantity) || 1;

            const price =
                Number(item.price) || 0;

            const itemTotal =
                price * quantity;

            total += itemTotal;


            const div =
                document.createElement("div");

            div.className =
                "summary-item";

            div.innerHTML = `
                <span>
                    ${item.name} × ${quantity}
                </span>

                <strong>
                    ₹${itemTotal.toLocaleString("en-IN")}
                </strong>
            `;

            container.appendChild(div);

        });


        totalElement.textContent =
            "₹" + total.toLocaleString("en-IN");
    }


    // ==============================
    // PLACE ORDER
    // ==============================

    document
        .getElementById("checkoutForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            if (!cart || cart.length === 0) {

                alert("Your cart is empty.");

                return;
            }


            const button =
                document.getElementById("placeOrderBtn");


            button.disabled = true;

            button.textContent =
                "Processing Order...";


            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const phone =
                document.getElementById("phone").value.trim();

            const address =
                document.getElementById("address").value.trim();

            const city =
                document.getElementById("city").value.trim();

            const pincode =
                document.getElementById("pincode").value.trim();

            const paymentMethod =
                document.querySelector(
                    'input[name="payment"]:checked'
                ).value;


            // Calculate total

            let total = 0;

            cart.forEach(item => {

                total +=
                    Number(item.price || 0) *
                    Number(item.quantity || 1);

            });


            // Order data

            const orderData = {

                customer: {
                    name: name,
                    email: email,
                    phone: phone,
                    address: address,
                    city: city,
                    pincode: pincode
                },

                items: cart.map(item => ({

                    id: item.id,

                    name: item.name,

                    price: Number(item.price),

                    image: item.image || "",

                    description:
                        item.description || "",

                    quantity:
                        Number(item.quantity) || 1

                })),

                totalAmount: total,

                paymentMethod: paymentMethod

            };


            console.log(
                "Sending order:",
                orderData
            );


            try {

                const response = await fetch(
                    `${API_URL}/api/orders`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(orderData)
                    }
                );


                console.log(
                    "Response status:",
                    response.status
                );


                const data =
                    await response.json();


                console.log(
                    "Order response:",
                    data
                );


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        data.error ||
                        "Order failed"
                    );

                }


                if (!data.success && !data.order) {

                    throw new Error(
                        "Order was not created"
                    );

                }


                // Clear cart

                localStorage.removeItem("cart");


                // Save order information

                if (data.order) {

                    localStorage.setItem(
                        "lastOrder",
                        JSON.stringify(data.order)
                    );

                }


                // Redirect to success page

                window.location.href =
                    "checkout-success.html";


            } catch (error) {

                console.error(
                    "ORDER ERROR:",
                    error
                );


                alert(
                    "Order could not be placed. Please try again."
                );


                button.disabled = false;

                button.textContent =
                    "Place Order";

            }

        });


    // ==============================
    // HOME
    // ==============================

    function goHome() {

        window.location.href =
            "index.html";

    }


    // ==============================
    // LOAD
    // ==============================

    loadCart();

</script>

</body>
</html>
