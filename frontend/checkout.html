<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlashMart - Checkout</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6f8;
            color: #111827;
        }

        /* ================= HEADER ================= */

        header {
            background: #111827;
            color: white;

            padding: 18px 6%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .home-btn {
            background: #2563eb;
            color: white;

            text-decoration: none;

            padding: 11px 18px;

            border-radius: 8px;
        }

        /* ================= MAIN ================= */

        .container {
            width: 90%;
            max-width: 1100px;

            margin: 40px auto;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 30px;
        }

        /* ================= BOX ================= */

        .box {
            background: white;

            padding: 25px;

            border-radius: 14px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .box h2 {
            margin-bottom: 25px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {

            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {

            border-color: #2563eb;
        }

        textarea {

            height: 100px;

            resize: vertical;
        }

        /* ================= ORDER ITEM ================= */

        .order-item {

            display: flex;

            align-items: center;

            gap: 15px;

            padding: 15px 0;

            border-bottom: 1px solid #e5e7eb;
        }

        .order-item img {

            width: 75px;

            height: 75px;

            object-fit: cover;

            border-radius: 8px;

            background: #eee;
        }

        .item-info {

            flex: 1;
        }

        .item-info h3 {

            font-size: 16px;

            margin-bottom: 6px;
        }

        .item-info p {

            color: #6b7280;

            font-size: 14px;
        }

        .item-total {

            font-weight: bold;
        }

        /* ================= TOTAL ================= */

        .total-row {

            display: flex;

            justify-content: space-between;

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #ddd;

            font-size: 23px;

            font-weight: bold;
        }

        .total {

            color: #2563eb;
        }

        /* ================= BUTTON ================= */

        .place-order {

            width: 100%;

            margin-top: 20px;

            padding: 15px;

            border: none;

            border-radius: 8px;

            background: #111827;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .place-order:hover {

            background: #2563eb;
        }

        /* ================= EMPTY ================= */

        .empty {

            text-align: center;

            padding: 50px 20px;

            color: #6b7280;
        }

        .shop-btn {

            display: inline-block;

            margin-top: 20px;

            padding: 12px 20px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            border-radius: 8px;
        }

        /* ================= SUCCESS ================= */

        .success-screen {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.6);

            align-items: center;

            justify-content: center;

            z-index: 1000;
        }

        .success-box {

            width: 90%;

            max-width: 450px;

            background: white;

            padding: 40px;

            border-radius: 15px;

            text-align: center;
        }

        .success-box h2 {

            color: #16a34a;

            margin-bottom: 15px;
        }

        .success-box p {

            margin-bottom: 15px;

            color: #4b5563;
        }

        .continue-btn {

            display: inline-block;

            margin-top: 15px;

            padding: 12px 22px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            border-radius: 8px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 800px) {

            .container {

                grid-template-columns: 1fr;
            }

            .logo {

                font-size: 22px;
            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        🛒 FlashMart
    </div>

    <a
        href="index.html"
        class="home-btn"
    >
        Home
    </a>

</header>


<!-- ================= MAIN ================= -->

<div class="container">


    <!-- ================= CUSTOMER FORM ================= -->

    <div class="box">

        <h2>
            📦 Delivery Details
        </h2>


        <form id="checkoutForm">


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Address
                </label>

                <textarea
                    id="address"
                    placeholder="Enter your complete address"
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label>
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    placeholder="Enter your city"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Pincode
                </label>

                <input
                    type="text"
                    id="pincode"
                    placeholder="Enter pincode"
                    maxlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="place-order"
                id="placeOrderButton"
            >
                🛍️ Place Order
            </button>


        </form>

    </div>


    <!-- ================= ORDER SUMMARY ================= -->

    <div class="box">

        <h2>
            🛒 Order Summary
        </h2>


        <div id="orderItems">

        </div>


        <div class="total-row">

            <span>
                Total
            </span>

            <span
                class="total"
                id="totalAmount"
            >
                ₹0
            </span>

        </div>

    </div>


</div>


<!-- ================= SUCCESS ================= -->

<div
    class="success-screen"
    id="successScreen"
>

    <div class="success-box">

        <h2>
            ✅ Order Placed Successfully!
        </h2>

        <p>
            Thank you for shopping with FlashMart.
        </p>

        <p>
            Your Order ID:
        </p>

        <p>

            <strong id="orderId">
            </strong>

        </p>

        <p>

            Total:
            <strong id="successTotal">
            </strong>

        </p>

        <a
            href="index.html"
            class="continue-btn"
        >
            Continue Shopping
        </a>

    </div>

</div>


<script>

    /* =================================
       GET CART
    ================================= */

    function getCart() {

        return JSON.parse(
            localStorage.getItem(
                "flashmartCart"
            ) || "[]"
        );

    }


    /* =================================
       DISPLAY ORDER
    ================================= */

    function displayOrder() {

        const cart = getCart();

        const container =
            document.getElementById(
                "orderItems"
            );

        const totalElement =
            document.getElementById(
                "totalAmount"
            );


        if (cart.length === 0) {

            container.innerHTML = `

                <div class="empty">

                    <h3>
                        Your cart is empty 🛒
                    </h3>

                    <p>
                        Please add products first.
                    </p>

                    <a
                        href="index.html"
                        class="shop-btn"
                    >
                        Continue Shopping
                    </a>

                </div>

            `;

            document.getElementById(
                "placeOrderButton"
            ).disabled = true;

            return;

        }


        let total = 0;

        container.innerHTML = "";


        cart.forEach(item => {

            const price =
                Number(item.price) || 0;

            const quantity =
                Number(item.quantity) || 1;

            const itemTotal =
                price * quantity;


            total += itemTotal;


            const itemElement =
                document.createElement(
                    "div"
                );


            itemElement.className =
                "order-item";


            itemElement.innerHTML = `

                <img
                    src="${item.image}"
                    alt="${item.name}"
                    onerror="
                        this.src='https://placehold.co/100x100?text=Product'
                    "
                >

                <div class="item-info">

                    <h3>
                        ${item.name}
                    </h3>

                    <p>
                        ₹${price.toLocaleString("en-IN")}
                        ×
                        ${quantity}
                    </p>

                </div>

                <div class="item-total">

                    ₹${itemTotal.toLocaleString("en-IN")}

                </div>

            `;


            container.appendChild(
                itemElement
            );

        });


        totalElement.textContent =
            "₹" +
            total.toLocaleString("en-IN");

    }


    /* =================================
       PLACE ORDER
    ================================= */

    document
        .getElementById("checkoutForm")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const cart = getCart();


                if (cart.length === 0) {

                    alert(
                        "Your cart is empty!"
                    );

                    return;

                }


                const name =
                    document
                        .getElementById("name")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const phone =
                    document
                        .getElementById("phone")
                        .value
                        .trim();


                const address =
                    document
                        .getElementById("address")
                        .value
                        .trim();


                const city =
                    document
                        .getElementById("city")
                        .value
                        .trim();


                const pincode =
                    document
                        .getElementById("pincode")
                        .value
                        .trim();


                if (
                    !name ||
                    !email ||
                    !phone ||
                    !address ||
                    !city ||
                    !pincode
                ) {

                    alert(
                        "Please fill all details."
                    );

                    return;

                }


                /* ==========================
                   CALCULATE TOTAL
                ========================== */

                const total =
                    cart.reduce(
                        function(sum, item) {

                            return sum +
                                (
                                    Number(item.price) *
                                    Number(item.quantity)
                                );

                        },
                        0
                    );


                /* ==========================
                   CREATE ORDER
                ========================== */

                const order = {

                    orderId:
                        "FM" +
                        Date.now(),

                    customer: {

                        name:
                            name,

                        email:
                            email,

                        phone:
                            phone,

                        address:
                            address,

                        city:
                            city,

                        pincode:
                            pincode

                    },

                    items:
                        cart,

                    total:
                        total,

                    date:
                        new Date()
                            .toLocaleString("en-IN")

                };


                /* ==========================
                   SAVE ORDER
                ========================== */

                let orders =
                    JSON.parse(
                        localStorage.getItem(
                            "flashmartOrders"
                        ) || "[]"
                    );


                orders.push(order);


                localStorage.setItem(
                    "flashmartOrders",
                    JSON.stringify(orders)
                );


                /* ==========================
                   CLEAR CART
                ========================== */

                localStorage.removeItem(
                    "flashmartCart"
                );


                /* ==========================
                   SUCCESS
                ========================== */

                document.getElementById(
                    "orderId"
                ).textContent =
                    order.orderId;


                document.getElementById(
                    "successTotal"
                ).textContent =
                    "₹" +
                    total.toLocaleString("en-IN");


                document.getElementById(
                    "successScreen"
                ).style.display =
                    "flex";

            }
        );


    /* =================================
       START
    ================================= */

    displayOrder();

</script>


</body>
</html>
