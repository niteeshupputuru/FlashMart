<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlashMart - Online Shopping</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        /* ================= NAVBAR ================= */

        nav {
            background: #111827;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-buttons a {
            text-decoration: none;
            color: white;
            background: #2563eb;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .nav-buttons a:hover {
            background: #1d4ed8;
        }

        /* ================= HERO ================= */

        .hero {
            background: white;
            text-align: center;
            padding: 80px 20px;
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #6b7280;
            font-size: 21px;
        }

        .shop-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        /* ================= PRODUCTS ================= */

        .products-section {
            padding: 60px 6%;
        }

        .section-title {
            text-align: center;
            font-size: 38px;
            margin-bottom: 45px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        }

        .product-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .description {
            color: #6b7280;
            min-height: 45px;
            line-height: 1.4;
        }

        .price {
            color: #2563eb;
            font-size: 25px;
            font-weight: bold;
            margin: 15px 0;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .add-btn,
        .details-btn {
            flex: 1;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .add-btn {
            background: #111827;
            color: white;
        }

        .add-btn:hover {
            background: #2563eb;
        }

        .details-btn {
            background: #e5e7eb;
            color: #111827;
        }

        .details-btn:hover {
            background: #d1d5db;
        }

        /* ================= LOADING ================= */

        .loading {
            text-align: center;
            font-size: 20px;
            color: #6b7280;
            padding: 40px;
        }

        /* ================= FOOTER ================= */

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 30px;
            margin-top: 30px;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 1000px) {

            .products {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 700px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            .nav-buttons {
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero h1 {
                font-size: 38px;
            }

            .products {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav>

    <div class="logo">
        🛒 FlashMart
    </div>

    <div class="nav-buttons">

        <a href="/">
            Home
        </a>

        <a href="/login">
            Login
        </a>

        <a href="/register">
            Register
        </a>

        <a href="/cart">
            Cart 🛍️ <span id="cartCount">0</span>
        </a>

    </div>

</nav>


<!-- ================= HERO ================= -->

<section class="hero">

    <h1>
        Welcome to FlashMart
    </h1>

    <p>
        Shop your favorite products at the best prices
    </p>

    <a href="#products" class="shop-btn">
        Shop Now
    </a>

</section>


<!-- ================= PRODUCTS ================= -->

<section class="products-section" id="products">

    <h2 class="section-title">
        Our Products
    </h2>

    <div id="productsContainer" class="products">

        <div class="loading">
            Loading products...
        </div>

    </div>

</section>


<!-- ================= FOOTER ================= -->

<footer>

    <p>
        © 2026 FlashMart. All Rights Reserved.
    </p>

</footer>


<script>

    /* =========================================
       CART
    ========================================= */

    function getCart() {

        try {

            return JSON.parse(
                localStorage.getItem("cart")
            ) || [];

        } catch (error) {

            return [];

        }

    }


    function saveCart(cart) {

        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );

    }


    /* =========================================
       UPDATE CART COUNT
    ========================================= */

    function updateCartCount() {

        const cart = getCart();

        let count = 0;

        cart.forEach(item => {

            count += Number(item.quantity) || 1;

        });

        document.getElementById("cartCount").innerText =
            count;

    }


    /* =========================================
       ADD PRODUCT TO CART
    ========================================= */

    function addToCart(product) {

        let cart = getCart();

        const existingProduct =
            cart.find(
                item =>
                    Number(item.id) === Number(product.id)
            );


        if (existingProduct) {

            existingProduct.quantity =
                (Number(existingProduct.quantity) || 1) + 1;

        } else {

            cart.push({

                id: product.id,

                name: product.name,

                price: Number(product.price),

                image: product.image,

                description: product.description,

                quantity: 1

            });

        }


        saveCart(cart);

        updateCartCount();


        alert(
            product.name + " added to cart 🛒"
        );

    }


    /* =========================================
       OPEN PRODUCT DETAILS
    ========================================= */

    function viewProduct(id) {

        window.location.href =
            "/product?id=" + id;

    }


    /* =========================================
       CREATE PRODUCT CARD
    ========================================= */

    function createProductCard(product) {

        const card =
            document.createElement("div");

        card.className =
            "product-card";


        card.innerHTML = `

            <img
                src="${product.image}"
                alt="${product.name}"
                class="product-image"
                onerror="this.src='https://via.placeholder.com/800x600?text=FlashMart+Product'"
            >

            <div class="product-info">

                <h3 class="product-name">
                    ${product.name}
                </h3>

                <p class="description">
                    ${product.description}
                </p>

                <div class="price">
                    ₹${Number(product.price).toLocaleString("en-IN")}
                </div>

                <div class="buttons">

                    <button
                        class="add-btn"
                        onclick='addToCart(${JSON.stringify(product)})'
                    >
                        🛒 Add to Cart
                    </button>

                    <button
                        class="details-btn"
                        onclick="viewProduct(${product.id})"
                    >
                        View Details
                    </button>

                </div>

            </div>

        `;


        return card;

    }


    /* =========================================
       LOAD PRODUCTS FROM SERVER
    ========================================= */

    async function loadProducts() {

        const container =
            document.getElementById(
                "productsContainer"
            );


        try {

            const response =
                await fetch("https://flashmart-backend.onrender.com/api/products")");


            if (!response.ok) {

                throw new Error(
                    "Products API failed"
                );

            }


            const products =
                await response.json();


            container.innerHTML = "";


            if (
                !products ||
                products.length === 0
            ) {

                container.innerHTML = `
                    <div class="loading">
                        No products available.
                    </div>
                `;

                return;

            }


            products.forEach(product => {

                const card =
                    createProductCard(product);

                container.appendChild(card);

            });


        } catch (error) {

            console.error(error);


            container.innerHTML = `

                <div class="loading">

                    ❌ Products could not be loaded.

                    <br><br>

                    Please make sure the server
                    is running.

                </div>

            `;

        }

    }


    /* =========================================
       PAGE LOAD
    ========================================= */

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            updateCartCount();

            loadProducts();

        }
    );

</script>


</body>

</html>
