<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlashMart</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        /* NAVBAR */
        nav {
            background: #111827;
            color: white;
            padding: 20px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .nav-buttons a {
            text-decoration: none;
            color: white;
            background: #2563eb;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        .nav-buttons a:hover {
            background: #1d4ed8;
        }

        /* HERO */
        .hero {
            background: white;
            text-align: center;
            padding: 90px 20px;
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 22px;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .shop-btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 16px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        /* PRODUCTS */
        .products-section {
            padding: 70px 6%;
        }

        .products-section h2 {
            text-align: center;
            font-size: 40px;
            margin-bottom: 50px;
        }

        #productsContainer {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .product-info {
            padding: 20px;
        }

        .product-info h3 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .description {
            color: #6b7280;
            min-height: 45px;
            margin-bottom: 15px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 15px;
        }

        .cart-btn {
            width: 100%;
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-btn:hover {
            background: #1d4ed8;
        }

        .loading {
            text-align: center;
            font-size: 20px;
            color: #6b7280;
            grid-column: 1 / -1;
        }

        .error {
            text-align: center;
            color: red;
            font-size: 20px;
            grid-column: 1 / -1;
        }

        /* FOOTER */
        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 30px;
        }

        /* MOBILE */
        @media (max-width: 600px) {

            nav {
                flex-direction: column;
                gap: 20px;
            }

            .nav-buttons {
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero h1 {
                font-size: 38px;
            }

            .hero p {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav>

        <div class="logo">
            🛒 FlashMart
        </div>

        <div class="nav-buttons">

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

            <a href="register.html">
                Register
            </a>

            <a href="cart.html">
                Cart 🛍️ <span id="cartCount">0</span>
            </a>

        </div>

    </nav>


    <!-- HERO -->
    <section class="hero">

        <h1>
            Welcome to FlashMart
        </h1>

        <p>
            Shop your favorite products at the best prices
        </p>

        <a href="#products" class="shop-btn">
            Shop Now
        </a>

    </section>


    <!-- PRODUCTS -->
    <section class="products-section" id="products">

        <h2>
            Our Products
        </h2>

        <div id="productsContainer">

            <div class="loading">
                Loading products...
            </div>

        </div>

    </section>


    <!-- FOOTER -->
    <footer>

        © 2026 FlashMart. All Rights Reserved.

    </footer>


    <script>

        // ==========================================
        // BACKEND API
        // ==========================================

        const API_URL =
            "https://flashmart-backend.onrender.com";


        // ==========================================
        // CART COUNT
        // ==========================================

        function updateCartCount() {

            const cart =
                JSON.parse(localStorage.getItem("cart")) || [];

            let total = 0;

            cart.forEach(item => {
                total += item.quantity || 1;
            });

            document.getElementById("cartCount").textContent = total;
        }


        // ==========================================
        // ADD TO CART
        // ==========================================

        function addToCart(product) {

            let cart =
                JSON.parse(localStorage.getItem("cart")) || [];

            const existing =
                cart.find(item => item.id === product.id);

            if (existing) {

                existing.quantity =
                    (existing.quantity || 1) + 1;

            } else {

                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    image: product.image,
                    quantity: 1
                });

            }

            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );

            updateCartCount();

            alert(product.name + " added to cart 🛒");
        }


        // ==========================================
        // LOAD PRODUCTS
        // ==========================================

        async function loadProducts() {

            const container =
                document.getElementById("productsContainer");

            try {

                const response = await fetch(
                    API_URL + "/api/products"
                );

                if (!response.ok) {
                    throw new Error(
                        "Products API failed"
                    );
                }

                const products =
                    await response.json();

                container.innerHTML = "";


                // Check products
                if (!products.length) {

                    container.innerHTML = `
                        <div class="error">
                            No products available.
                        </div>
                    `;

                    return;
                }


                // Create product cards
                products.forEach(product => {

                    const card =
                        document.createElement("div");

                    card.className =
                        "product-card";


                    card.innerHTML = `

                        <img
                            src="${product.image}"
                            alt="${product.name}"
                        >

                        <div class="product-info">

                            <h3>
                                ${product.name}
                            </h3>

                            <p class="description">
                                ${product.description}
                            </p>

                            <div class="price">
                                ₹${product.price}
                            </div>

                            <button
                                class="cart-btn"
                                onclick='addToCart(${JSON.stringify(product)})'
                            >
                                Add to Cart 🛒
                            </button>

                        </div>

                    `;

                    container.appendChild(card);

                });

            }

            catch (error) {

                console.error(
                    "Products Error:",
                    error
                );

                container.innerHTML = `

                    <div class="error">

                        ❌ Products could not be loaded.

                        <br><br>

                        Please try again later.

                    </div>

                `;

            }

        }


        // ==========================================
        // PAGE LOAD
        // ==========================================

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                updateCartCount();

                loadProducts();

            }
        );

    </script>

</body>
</html>
