<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlashMart - Online Shopping</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6f8;
            color: #111827;
        }

        /* HEADER */

        header {
            background: #111827;
            color: white;
            padding: 18px 6%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        .nav {
            display: flex;
            gap: 12px;
        }

        .nav a {
            text-decoration: none;
            color: white;
            background: #2563eb;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .nav a:hover {
            background: #1d4ed8;
        }

        /* HERO */

        .hero {
            background: white;
            text-align: center;
            padding: 80px 20px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #6b7280;
            font-size: 20px;
        }

        /* PRODUCTS */

        .products-section {
            width: 90%;
            max-width: 1200px;
            margin: 50px auto;
        }

        .section-title {
            text-align: center;
            font-size: 34px;
            margin-bottom: 35px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        /* PRODUCT CARD */

        .product-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;

            box-shadow: 0 5px 20px rgba(0,0,0,0.08);

            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        /* IMAGE */

        .product-image {
            width: 100%;
            height: 260px;
            background: #eeeeee;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* PRODUCT INFO */

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .product-description {
            color: #6b7280;
            font-size: 14px;
            min-height: 40px;
            margin-bottom: 12px;
        }

        .product-price {
            color: #2563eb;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            gap: 8px;
        }

        .add-cart {
            flex: 1;
            border: none;
            background: #111827;
            color: white;

            padding: 11px;
            border-radius: 7px;

            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .add-cart:hover {
            background: #2563eb;
        }

        .details {
            flex: 1;
            border: none;
            background: #e5e7eb;
            color: #111827;

            padding: 11px;
            border-radius: 7px;

            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .details:hover {
            background: #d1d5db;
        }

        /* LOADING */

        .loading {
            text-align: center;
            font-size: 20px;
            color: #6b7280;
            padding: 50px;
            grid-column: 1 / -1;
        }

        /* ERROR */

        .error {
            text-align: center;
            color: #dc2626;
            font-size: 18px;
            padding: 50px;
            grid-column: 1 / -1;
        }

        /* TOAST */

        .toast {
            position: fixed;
            right: 25px;
            bottom: 25px;

            background: #111827;
            color: white;

            padding: 15px 22px;
            border-radius: 8px;

            display: none;
            z-index: 200;
        }

        .toast.show {
            display: block;
        }

        /* FOOTER */

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 70px;
        }

        /* MOBILE */

        @media (max-width: 1000px) {

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            header {
                padding: 15px;
            }

            .logo {
                font-size: 23px;
            }

            .nav a {
                padding: 9px 12px;
                font-size: 13px;
            }

            .hero {
                padding: 60px 15px;
            }

            .hero h1 {
                font-size: 35px;
            }

            .hero p {
                font-size: 16px;
            }

            .products-section {
                width: 94%;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">
        🛒 FlashMart
    </div>

    <div class="nav">

        <a href="index.html">
            Home
        </a>

        <a href="cart.html">
            Cart 🛍️ <span id="cartCount">0</span>
        </a>

    </div>

</header>


<!-- HERO -->

<section class="hero">

    <h1>
        Welcome to FlashMart
    </h1>

    <p>
        Shop your favorite products at the best prices
    </p>

</section>


<!-- PRODUCTS -->

<section class="products-section">

    <h2 class="section-title">
        Our Products
    </h2>

    <div
        class="product-grid"
        id="productGrid"
    >

        <div class="loading">
            Loading products...
        </div>

    </div>

</section>


<!-- TOAST -->

<div
    class="toast"
    id="toast"
>
</div>


<!-- FOOTER -->

<footer>

    © 2026 FlashMart. All Rights Reserved.

</footer>


<script>

    /* ==============================
       API
    ============================== */

    const API_URL = "/api/products";


    /* ==============================
       GET CART
    ============================== */

    function getCart() {

        return JSON.parse(
            localStorage.getItem("flashmartCart") || "[]"
        );

    }


    /* ==============================
       SAVE CART
    ============================== */

    function saveCart(cart) {

        localStorage.setItem(
            "flashmartCart",
            JSON.stringify(cart)
        );

    }


    /* ==============================
       CART COUNT
    ============================== */

    function updateCartCount() {

        const cart = getCart();

        let count = 0;

        cart.forEach(item => {

            count += Number(item.quantity) || 0;

        });

        document.getElementById("cartCount").textContent = count;

    }


    /* ==============================
       TOAST MESSAGE
    ============================== */

    function showMessage(message) {

        const toast =
            document.getElementById("toast");

        toast.textContent = message;

        toast.classList.add("show");

        setTimeout(() => {

            toast.classList.remove("show");

        }, 2000);

    }


    /* ==============================
       ADD TO CART
    ============================== */

    function addToCart(product) {

        let cart = getCart();

        const existingProduct =
            cart.find(
                item => String(item.id) === String(product.id)
            );


        if (existingProduct) {

            existingProduct.quantity =
                Number(existingProduct.quantity) + 1;

        } else {

            cart.push({

                id: product.id,

                name: product.name,

                price: Number(product.price),

                image: product.image,

                quantity: 1

            });

        }


        saveCart(cart);

        updateCartCount();

        showMessage(
            product.name + " added to cart 🛒"
        );

    }


    /* ==============================
       PRODUCT DETAILS
    ============================== */

    function viewDetails(id) {

        window.location.href =
            "product.html?id=" + id;

    }


    /* ==============================
       LOAD PRODUCTS
    ============================== */

    async function loadProducts() {

        const grid =
            document.getElementById("productGrid");


        try {

            const response =
                await fetch(API_URL);


            if (!response.ok) {

                throw new Error(
                    "Unable to load products"
                );

            }


            const products =
                await response.json();


            if (
                !Array.isArray(products) ||
                products.length === 0
            ) {

                grid.innerHTML = `
                    <div class="error">
                        No products available.
                    </div>
                `;

                return;

            }


            grid.innerHTML = "";


            products.forEach(product => {

                const card =
                    document.createElement("div");

                card.className =
                    "product-card";


                const image =
                    product.image ||
                    "https://via.placeholder.com/500x500?text=Product";


                card.innerHTML = `

                    <div class="product-image">

                        <img
                            src="${image}"
                            alt="${product.name}"
                            onerror="
                                this.src='https://via.placeholder.com/500x500?text=Product'
                            "
                        >

                    </div>


                    <div class="product-info">

                        <h3 class="product-name">
                            ${product.name}
                        </h3>


                        <p class="product-description">

                            ${
                                product.description ||
                                "High quality product from FlashMart."
                            }

                        </p>


                        <div class="product-price">

                            ₹${Number(product.price).toLocaleString("en-IN")}

                        </div>


                        <div class="buttons">

                            <button
                                class="add-cart"
                                onclick='addToCart(${JSON.stringify(product)})'
                            >
                                🛒 Add to Cart
                            </button>


                            <button
                                class="details"
                                onclick="viewDetails(${product.id})"
                            >
                                View Details
                            </button>

                        </div>

                    </div>

                `;


                grid.appendChild(card);

            });

        }

        catch (error) {

            console.error(error);


            grid.innerHTML = `

                <div class="error">

                    ❌ Products load avvatledu.

                    <br><br>

                    Backend server running undho check cheyyandi.

                </div>

            `;

        }

    }


    /* ==============================
       START
    ============================== */

    updateCartCount();

    loadProducts();

</script>


</body>
</html>
