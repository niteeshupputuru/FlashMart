<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlashMart - Online Shopping</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        /* =========================
           NAVBAR
        ========================= */

        nav {
            background: #111827;
            color: white;
            padding: 18px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            background: #2563eb;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background: #1d4ed8;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            background: white;
            text-align: center;
            padding: 80px 20px;
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 22px;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .shop-btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 15px 32px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .shop-btn:hover {
            background: #1d4ed8;
        }

        /* =========================
           PRODUCTS SECTION
        ========================= */

        .products-section {
            padding: 70px 6%;
        }

        .products-section h2 {
            text-align: center;
            font-size: 38px;
            margin-bottom: 45px;
        }

        .products-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 30px;
        }

        /* =========================
           PRODUCT CARD
        ========================= */

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .product-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .product-info {
            padding: 20px;
        }

        .product-info h3 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .product-info p {
            color: #6b7280;
            line-height: 1.5;
            min-height: 45px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            color: #2563eb;
            margin: 15px 0;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .view-btn {
            background: #e5e7eb;
            color: #111827;
        }

        .cart-btn {
            background: #2563eb;
            color: white;
        }

        .view-btn:hover {
            background: #d1d5db;
        }

        .cart-btn:hover {
            background: #1d4ed8;
        }

        /* =========================
           LOADING / ERROR
        ========================= */

        .loading {
            text-align: center;
            font-size: 20px;
            color: #6b7280;
            padding: 40px;
        }

        .error {
            text-align: center;
            color: red;
            padding: 40px;
            font-size: 18px;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 30px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            nav {
                flex-direction: column;
                gap: 20px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero h1 {
                font-size: 38px;
            }

            .hero p {
                font-size: 18px;
            }

            .products-section h2 {
                font-size: 30px;
            }
        }
    </style>
</head>


<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <nav>

        <div class="logo">
            🛒 FlashMart
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

            <a href="register.html">
                Register
            </a>

            <a href="cart.html">
                Cart 🛍️
                <span id="cartCount">0</span>
            </a>

        </div>

    </nav>


    <!-- =========================
         HERO
    ========================== -->

    <section class="hero">

        <h1>
            Welcome to FlashMart
        </h1>

        <p>
            Shop your favorite products at the best prices
        </p>

        <a href="#products" class="shop-btn">
            Shop Now
        </a>

    </section>


    <!-- =========================
         PRODUCTS
    ========================== -->

    <section
        class="products-section"
        id="products"
    >

        <h2>
            Our Products
        </h2>

        <div
            id="productsContainer"
            class="products-container"
        >

            <div class="loading">
                Loading products...
            </div>

        </div>

    </section>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 FlashMart. All Rights Reserved.
        </p>

    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        /* =====================================
           BACKEND API
        ===================================== */

        const API_URL =
            "https://flashmart-backend.onrender.com";


        /* =====================================
           GET CART
        ===================================== */

        function getCart() {

            try {

                return JSON.parse(
                    localStorage.getItem("cart") || "[]"
                );

            } catch (error) {

                return [];

            }

        }


        /* =====================================
           UPDATE CART COUNT
        ===================================== */

        function updateCartCount() {

            const cart = getCart();

            let count = 0;

            cart.forEach(item => {

                count += item.quantity || 1;

            });

            const cartCount =
                document.getElementById("cartCount");

            if (cartCount) {

                cartCount.textContent = count;

            }

        }


        /* =====================================
           ADD TO CART
        ===================================== */

        function addToCart(product) {

            let cart = getCart();

            const existingProduct =
                cart.find(
                    item =>
                        Number(item.id) === Number(product.id)
                );


            if (existingProduct) {

                existingProduct.quantity =
                    (existingProduct.quantity || 1) + 1;

            } else {

                cart.push({

                    id: product.id,

                    name: product.name,

                    price: product.price,

                    image: product.image,

                    description: product.description,

                    quantity: 1

                });

            }


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            updateCartCount();


            alert(
                product.name + " added to cart 🛒"
            );

        }


        /* =====================================
           VIEW PRODUCT
        ===================================== */

        function viewProduct(id) {

            window.location.href =
                "product.html?id=" + id;

        }


        /* =====================================
           LOAD PRODUCTS
        ===================================== */

        async function loadProducts() {

            const container =
                document.getElementById(
                    "productsContainer"
                );


            container.innerHTML = `
                <div class="loading">
                    Loading products...
                </div>
            `;


            try {

                console.log(
                    "Connecting to:",
                    API_URL + "/api/products"
                );


                const response =
                    await fetch(
                        API_URL + "/api/products"
                    );


                if (!response.ok) {

                    throw new Error(
                        "API request failed: " +
                        response.status
                    );

                }


                const products =
                    await response.json();


                console.log(
                    "Products received:",
                    products
                );


                if (
                    !Array.isArray(products) ||
                    products.length === 0
                ) {

                    container.innerHTML = `
                        <div class="error">
                            No products available.
                        </div>
                    `;

                    return;

                }


                container.innerHTML = "";


                products.forEach(product => {

                    const card =
                        document.createElement("div");

                    card.className =
                        "product-card";


                    card.innerHTML = `

                        <img
                            src="${product.image}"
                            alt="${product.name}"
                            onerror="this.src='https://via.placeholder.com/800x600?text=FlashMart'"
                        >

                        <div class="product-info">

                            <h3>
                                ${product.name}
                            </h3>

                            <p>
                                ${product.description}
                            </p>

                            <div class="price">
                                ₹${product.price}
                            </div>

                            <div class="buttons">

                                <button
                                    class="btn view-btn"
                                    onclick="viewProduct(${product.id})"
                                >
                                    View Details
                                </button>

                                <button
                                    class="btn cart-btn"
                                    onclick='addToCart(${JSON.stringify(product)})'
                                >
                                    Add to Cart
                                </button>

                            </div>

                        </div>
                    `;


                    container.appendChild(card);

                });

            }

            catch (error) {

                console.error(
                    "Products loading error:",
                    error
                );


                container.innerHTML = `

                    <div class="error">

                        ❌ Products could not be loaded.

                        <br><br>

                        Please try again later.

                    </div>

                `;

            }

        }


        /* =====================================
           PAGE LOAD
        ===================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                updateCartCount();

                loadProducts();

            }
        );

    </script>

</body>

</html>
