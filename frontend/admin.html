<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlashMart Admin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
        }

        .home-btn {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: bold;
        }

        main {
            width: 90%;
            max-width: 1400px;
            margin: 40px auto;
        }

        h2 {
            font-size: 34px;
            margin-bottom: 30px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #6b7280;
            margin-bottom: 12px;
        }

        .card p {
            color: #2563eb;
            font-size: 28px;
            font-weight: bold;
        }

        .orders-box {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            background: #111827;
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
            vertical-align: top;
        }

        tr:hover {
            background: #f9fafb;
        }

        .order-id {
            color: #2563eb;
            font-weight: bold;
        }

        .customer-name {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .products {
            line-height: 1.8;
        }

        .total {
            font-weight: bold;
            font-size: 17px;
        }

        .status {
            display: inline-block;
            background: #dcfce7;
            color: #15803d;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 20px;
        }

        .error {
            color: red;
            text-align: center;
            padding: 30px;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        @media (max-width: 800px) {

            .summary {
                grid-template-columns: 1fr;
            }

            main {
                width: 95%;
            }

            header {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>🛒 FlashMart Admin</h1>

    <a href="/" class="home-btn">
        Home
    </a>

</header>


<main>

    <h2>Orders Dashboard</h2>


    <div class="summary">

        <div class="card">
            <h3>Total Orders</h3>
            <p id="totalOrders">0</p>
        </div>

        <div class="card">
            <h3>Total Sales</h3>
            <p id="totalSales">₹0</p>
        </div>

        <div class="card">
            <h3>Latest Order</h3>
            <p id="latestOrder">-</p>
        </div>

    </div>


    <div class="orders-box">

        <div id="loading" class="loading">
            Loading orders...
        </div>

        <div id="error" class="error"></div>

        <div id="empty" class="empty" style="display:none;">
            No orders found.
        </div>

        <table id="ordersTable" style="display:none;">

            <thead>

                <tr>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Products</th>
                    <th>Payment</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Date</th>
                </tr>

            </thead>

            <tbody id="ordersBody"></tbody>

        </table>

    </div>

</main>


<script>

async function loadOrders() {

    try {

        const response = await fetch("/api/orders");

        if (!response.ok) {
            throw new Error("Orders API failed");
        }

        const data = await response.json();

        if (!data.success) {
            throw new Error("Could not load orders");
        }

        let orders = data.orders || [];


        // Remove invalid/empty orders
        orders = orders.filter(order => {

            return (
                order &&
                order.orderId &&
                (
                    Number(order.totalAmount || order.total || 0) > 0
                    ||
                    (order.items && order.items.length > 0)
                    ||
                    (order.products && order.products.length > 0)
                )
            );

        });


        // Latest first
        orders.sort((a, b) => {

            const dateA = new Date(
                a.createdAt || a.createdDate || 0
            );

            const dateB = new Date(
                b.createdAt || b.createdDate || 0
            );

            return dateB - dateA;

        });


        document.getElementById("loading").style.display = "none";


        // Total orders
        document.getElementById("totalOrders").textContent =
            orders.length;


        // Total sales
        let sales = 0;

        orders.forEach(order => {

            sales += Number(
                order.totalAmount ||
                order.total ||
                0
            );

        });


        document.getElementById("totalSales").textContent =
            "₹" + sales.toLocaleString("en-IN");


        // Latest order
        if (orders.length > 0) {

            document.getElementById("latestOrder").textContent =
                orders[0].orderId;

        } else {

            document.getElementById("latestOrder").textContent =
                "-";

        }


        // No orders
        if (orders.length === 0) {

            document.getElementById("empty").style.display =
                "block";

            return;
        }


        const tbody =
            document.getElementById("ordersBody");

        tbody.innerHTML = "";


        orders.forEach(order => {

            const row =
                document.createElement("tr");


            // ==========================================
            // CUSTOMER
            // ==========================================

            const customer =
                order.customer || {};


            const customerName =
                customer.name ||
                order.name ||
                "-";


            const email =
                customer.email ||
                order.email ||
                "-";


            const phone =
                customer.phone ||
                order.phone ||
                "-";


            const address =
                customer.address ||
                order.address ||
                "-";


            // ==========================================
            // PRODUCTS
            // ==========================================

            let productList = [];


            if (
                Array.isArray(order.items) &&
                order.items.length > 0
            ) {

                productList = order.items;

            } else if (
                Array.isArray(order.products) &&
                order.products.length > 0
            ) {

                productList = order.products;

            }


            let productHTML = "";


            productList.forEach(item => {

                const name =
                    item.name ||
                    "Product";


                const quantity =
                    item.quantity ||
                    1;


                productHTML +=
                    `${name} × ${quantity}<br>`;

            });


            if (!productHTML) {

                productHTML = "No products";

            }


            // ==========================================
            // TOTAL
            // ==========================================

            const amount = Number(
                order.totalAmount ||
                order.total ||
                0
            );


            // ==========================================
            // PAYMENT
            // ==========================================

            const payment =
                order.paymentMethod ||
                order.payment ||
                "Cash on Delivery";


            // ==========================================
            // STATUS
            // ==========================================

            const status =
                order.status ||
                "Order Placed";


            // ==========================================
            // DATE
            // ==========================================

            let date = "-";


            if (order.createdAt) {

                date = new Date(
                    order.createdAt
                ).toLocaleString("en-IN");

            } else if (order.createdDate) {

                date = new Date(
                    order.createdDate
                ).toLocaleString("en-IN");

            }


            // ==========================================
            // ROW
            // ==========================================

            row.innerHTML = `

                <td>
                    <span class="order-id">
                        ${order.orderId}
                    </span>
                </td>

                <td>

                    <div class="customer-name">
                        ${customerName}
                    </div>

                    ${email}<br>

                    ${phone}<br>

                    ${address}

                </td>

                <td class="products">

                    ${productHTML}

                </td>

                <td>

                    ${payment}

                </td>

                <td class="total">

                    ₹${amount.toLocaleString("en-IN")}

                </td>

                <td>

                    <span class="status">
                        ${status}
                    </span>

                </td>

                <td>

                    ${date}

                </td>

            `;


            tbody.appendChild(row);

        });


        document.getElementById("ordersTable").style.display =
            "table";


    } catch (error) {

        console.error(error);

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("error").textContent =
            "❌ Orders could not be loaded.";

    }

}


// Load when page opens
document.addEventListener(
    "DOMContentLoaded",
    loadOrders
);

</script>

</body>
</html>
